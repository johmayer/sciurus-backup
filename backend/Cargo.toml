[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
axum = "0.8.9"
base64 = "0.23.1"
bcrypt = "0.19.3"
chrono = { version = "0.4.45", features = ["serde"] }
cron = "0.17.0"
dotenv = "0.15.0"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["form", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "chrono", "uuid"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-cron-scheduler = "0.15.1"
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.0", features = ["fs"] }
tracing = "0.1.44"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
